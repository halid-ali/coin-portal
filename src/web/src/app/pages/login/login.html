<section class="mx-auto w-full max-w-md">
  <h1 class="mb-6 text-2xl font-semibold text-shade-900">{{ 'login.title' | transloco }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="card space-y-5">
    @if (formError(); as message) {
      <div role="alert" class="alert-error">{{ message }}</div>
    }

    <div>
      <label for="userNameOrEmail" class="form-label">{{
        'login.userNameOrEmail' | transloco
      }}</label>
      <input
        id="userNameOrEmail"
        type="text"
        formControlName="userNameOrEmail"
        appField
        autocomplete="username"
        class="form-input"
      />
      @if (errorMessage(form.controls.userNameOrEmail); as msg) {
        <p id="userNameOrEmail-error" class="form-error">{{ msg }}</p>
      }
    </div>

    <div>
      <label for="password" class="form-label">{{ 'login.password' | transloco }}</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        appField
        autocomplete="current-password"
        class="form-input"
      />
      @if (errorMessage(form.controls.password); as msg) {
        <p id="password-error" class="form-error">{{ msg }}</p>
      }
    </div>

    <label class="flex items-center gap-2 text-sm text-shade-700">
      <input
        type="checkbox"
        formControlName="rememberMe"
        class="size-4 rounded border-shade-300 text-brand-600 focus:ring-focus"
      />
      {{ 'login.rememberMe' | transloco }}
    </label>

    <button type="submit" class="btn-primary w-full" [disabled]="submitting()">
      {{ (submitting() ? 'login.submitting' : 'login.submit') | transloco }}
    </button>

    <p class="text-center text-sm text-shade-600">
      {{ 'login.noAccount' | transloco }}
      <a routerLink="/register" class="link">{{ 'login.registerLink' | transloco }}</a>
    </p>
  </form>
</section>
