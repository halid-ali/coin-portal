<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CoinVitrine</title>
    <meta
      name="description"
      content="Manage your coin collection, euro and other coins: photos, collections and sharing."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tab icon: the SVG follows the browser's light/dark mode; the .ico is the fallback -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Installable app (home screen, desktop); icons from scripts/make-icons.mjs -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CoinVitrine" />
    <!-- Title bar color, the header's: light here, dark set below and by ThemeService -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Dark theme before the first paint, so pages do not flash white. Same storage key and rules
      // as ThemeService, which takes over (and applies the account's theme) once Angular starts.
      try {
        var mode = localStorage.getItem('coinportal.theme');
        if (
          mode === 'Dark' ||
          (mode !== 'Light' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').content = '#0f172a';
        }
      } catch (e) {}
      // Accent color too (AccentService); Amber, the default, has no attribute
      try {
        var accent = localStorage.getItem('coinportal.accent');
        if (/^(Teal|Blue|Indigo|Violet|Rose|Lime)$/.test(accent)) {
          document.documentElement.setAttribute('data-accent', accent);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root>
      <!-- Until Angular starts (it replaces this; user choice 2026-10-10): the header as it will be,
       with shapes for its menu and buttons (signed in or not is not known yet), and a page of
       shapes that fits any page (nor is the page). Laid out as app.html and the header; the page's
       shapes fade in late (.app-shell-page in styles.css), so a fast start never shows them -->
      <div class="flex min-h-dvh flex-col bg-shade-50">
        <header
          class="border-b border-shade-200/80 bg-shade-0/85 backdrop-blur supports-backdrop-filter:bg-shade-0/70"
        >
          <div class="page-container flex h-16 items-center gap-6">
            <span
              class="flex shrink-0 items-center gap-2 text-lg font-bold whitespace-nowrap text-shade-900"
            >
              <!-- Same drawing as shared/logo (colors from styles.css) -->
              <svg class="size-8" viewBox="2 2 60 60" aria-hidden="true">
                <circle cx="32" cy="32" r="30" style="fill: var(--logo-coin)" />
                <path
                  d="M41.83 22.19A13.2 13.2 0 1 0 41.83 41.81M16 27.7H30.5M16 36.3H30.5"
                  fill="none"
                  stroke-width="4.8"
                  stroke-linecap="round"
                  style="stroke: var(--logo-sign)"
                />
              </svg>
              CoinVitrine
            </span>
            <div class="skeleton hidden h-9 w-28 rounded-lg sm:block" aria-hidden="true"></div>
            <div class="ml-auto flex items-center gap-2" aria-hidden="true">
              <div class="skeleton size-9 rounded-full"></div>
              <div class="skeleton h-9 w-9 rounded-lg sm:w-30"></div>
            </div>
          </div>
        </header>
        <p class="sr-only" role="status">Loading…</p>
        <div class="app-shell-page page-container flex-1 py-8" aria-hidden="true">
          <div class="skeleton h-7 w-64 max-w-[60%] rounded-full"></div>
          <div class="skeleton mt-3.5 h-3.5 w-96 max-w-[80%] rounded-full"></div>
          <div class="card mt-7 space-y-3 p-6">
            <div class="skeleton mb-4 h-4 w-2/5 rounded-full"></div>
            <div class="skeleton h-3 w-[90%] rounded-full"></div>
            <div class="skeleton h-3 w-3/4 rounded-full"></div>
            <div class="skeleton h-3 w-4/5 rounded-full"></div>
          </div>
          <div class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <div class="card overflow-hidden p-0">
              <div class="skeleton aspect-video rounded-none"></div>
              <div class="space-y-3 p-4">
                <div class="skeleton h-3.5 w-1/2 rounded-full"></div>
                <div class="skeleton h-3 w-1/3 rounded-full"></div>
              </div>
            </div>
            <div class="card overflow-hidden p-0">
              <div class="skeleton aspect-video rounded-none"></div>
              <div class="space-y-3 p-4">
                <div class="skeleton h-3.5 w-1/2 rounded-full"></div>
                <div class="skeleton h-3 w-1/3 rounded-full"></div>
              </div>
            </div>
            <div class="card overflow-hidden p-0 max-lg:hidden">
              <div class="skeleton aspect-video rounded-none"></div>
              <div class="space-y-3 p-4">
                <div class="skeleton h-3.5 w-1/2 rounded-full"></div>
                <div class="skeleton h-3 w-1/3 rounded-full"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </app-root>
  </body>
</html>
