<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CoinVitrine</title>
    <meta
      name="description"
      content="Manage your euro coin collection: photos, collections and sharing."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tab icon: the SVG follows the browser's light/dark mode; the .ico is the fallback -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Installable app (home screen, desktop); icons from scripts/make-icons.mjs -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CoinVitrine" />
    <!-- Title bar color, the header's: light here, dark set below and by ThemeService -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Dark theme before the first paint, so pages do not flash white. Same storage key and rules
      // as ThemeService, which takes over (and applies the account's theme) once Angular starts.
      try {
        var mode = localStorage.getItem('coinportal.theme');
        if (
          mode === 'Dark' ||
          (mode !== 'Light' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').content = '#0f172a';
        }
      } catch (e) {}
      // Accent color too (AccentService); Amber, the default, has no attribute
      try {
        var accent = localStorage.getItem('coinportal.accent');
        if (/^(Teal|Blue|Indigo|Violet|Rose|Lime)$/.test(accent)) {
          document.documentElement.setAttribute('data-accent', accent);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root>
      <!-- Until Angular starts (it replaces this). Styles: .app-splash in styles.css -->
      <div class="app-splash" role="status">
        <!-- Same drawing as shared/logo (colors from styles.css) -->
        <svg class="app-splash-logo" viewBox="2 2 60 60" aria-hidden="true">
          <circle cx="32" cy="32" r="30" style="fill: var(--logo-coin)" />
          <path
            d="M41.83 22.19A13.2 13.2 0 1 0 41.83 41.81M16 27.7H30.5M16 36.3H30.5"
            fill="none"
            stroke-width="4.8"
            stroke-linecap="round"
            style="stroke: var(--logo-sign)"
          />
        </svg>
        CoinVitrine
        <span class="sr-only">Loading…</span>
      </div>
    </app-root>
  </body>
</html>
