<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CoinVitrine</title>
    <meta
      name="description"
      content="Manage your coin collection, euro and other coins: photos, collections and sharing."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tab icon: the SVG follows the browser's light/dark mode; the .ico is the fallback -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Installable app (home screen, desktop); icons from scripts/make-icons.mjs -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CoinVitrine" />
    <!-- Title bar color, the header's: light here, dark set below and by ThemeService -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Dark theme before the first paint, so pages do not flash white. Same storage key and rules
      // as ThemeService, which takes over (and applies the account's theme) once Angular starts.
      try {
        var mode = localStorage.getItem('coinportal.theme');
        if (
          mode === 'Dark' ||
          (mode !== 'Light' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').content = '#0f172a';
        }
      } catch (e) {}
      // The shell below: signed in on this browser (AuthService SIGNED_IN_KEY, a hint: the auth
      // cookie is HttpOnly) and the home page, whose two versions it draws
      try {
        if (localStorage.getItem('coinportal.signedIn') === '1') {
          document.documentElement.setAttribute('data-shell-signed-in', '');
        }
      } catch (e) {}
      if (location.pathname === '/') {
        document.documentElement.setAttribute('data-shell-home', '');
      }
      // Accent color too (AccentService); Amber, the default, has no attribute
      try {
        var accent = localStorage.getItem('coinportal.accent');
        if (/^(Teal|Blue|Indigo|Violet|Rose|Lime)$/.test(accent)) {
          document.documentElement.setAttribute('data-accent', accent);
        }
      } catch (e) {}
    </script>
  </head>

    <app-root>
      <!-- Until Angular starts (it replaces this; user choice 2026-10-10): the header as it will be
       and the page's shapes. Signed in or not and the home page are known from the first script

       their own version (.app-shell-in / -out, -home / -generic in styles.css); any other page gets
       shapes that fit any page. Laid out with the classes of app.html, the header, HomeWelcome and
       HomeDashboard: change it with them. The page's shapes fade in late (.app-shell-page), so a
       fast start never shows them -->

               early), and an SVG without one fills the page -->

                <path

                  fill="none"
                  stroke-width="4.8"
                  stroke-linecap="round"
                  style="stroke: var(--logo-sign)"
