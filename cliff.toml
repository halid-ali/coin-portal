# git-cliff configuration: CHANGELOG.md from Conventional Commits (https://git-cliff.org)
# Generate: npx git-cliff --tag vX.Y.Z -o CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{%- macro print_commit(commit) -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endmacro -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") -%}
{% if group is not starting_with("<!-- hidden") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
{{ self::print_commit(commit=commit) }}
{%- endfor -%}
{% endif -%}
{%- endfor -%}
"""
footer = """

<!-- generated by git-cliff -->"""
trim = false

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
# Merge commits and bookkeeping commits go to a hidden group instead of being skipped: skipping the
# commit a tag points to breaks --bumped-version (git-cliff #816).
commit_parsers = [
  { message = "^Merge branch", group = "<!-- hidden -->" },
  { message = "^(feat|fix|chore|docs)(\\(.*\\))?: merge ", group = "<!-- hidden -->" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^(refactor|perf)", group = "<!-- 2 -->Changed" },
  { message = ".*", group = "<!-- hidden -->" },
]

[bump]
# Stay on 0.x until 1.0.0 is tagged on purpose: a breaking change bumps the minor version
breaking_always_bump_major = false
features_always_bump_minor = true
