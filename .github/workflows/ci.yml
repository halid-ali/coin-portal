name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the same checks on the tag it packages and deploys
  workflow_call:
    inputs:
      ref:
        description: Commit to check (empty = the triggering one)
        type: string
        default: ''

# A newer run on the same branch or pull request cancels the older one. The workflow name keeps a
# run called by release.yml (github.workflow is then "Release") apart from CI runs on main
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to a commit (the version in the comment); Dependabot updates both
jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # ImageSharp 4 fails Release builds without a license key (see README). Pull requests
      # (Dependabot, forks) get no secrets, so they build Debug, where a missing key is only a warning.
      CONFIGURATION: ${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }}
    services:
      # The API tests need a real SQL Server (collation, CHARINDEX, filtered indexes). The sa
      # password belongs to this throwaway container only, so it is not a secret. A fixed cumulative
      # update, not "latest": a new image is a deliberate change (Dependabot does not watch it)
      sql:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci_Tests_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Tests_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # MinVer derives the version from the tags in the history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --configuration "$CONFIGURATION"
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

      - name: Check for model changes without a migration
        run: >-
          dotnet ef migrations has-pending-model-changes --project src/api --no-build
          --configuration "$CONFIGURATION"
        env:
          # Design-time only; nothing connects to this database
          ConnectionStrings__DefaultConnection: Server=localhost;Database=ci;Trusted_Connection=True

      - name: Test
        run: >-
          dotnet test --project tests/api --no-build --configuration "$CONFIGURATION"
          --report-xunit-trx --results-directory "$RUNNER_TEMP/test-results"
        env:
          # Server only: each run creates and drops its own database
          COINPORTAL_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Ci_Tests_Passw0rd;TrustServerCertificate=True

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

      # The release package (API + client in wwwroot), as release.yml builds it: proves on every
      # main push that publishing still works, not only on the day of a release. Not when release.yml
      # calls this workflow: it publishes the real package right after
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name != 'pull_request' && github.workflow == 'CI'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Publish package
        if: github.event_name != 'pull_request' && github.workflow == 'CI'
        run: |
          (cd src/web && npm ci)
          dotnet publish src/api --configuration Release --output "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/wwwroot/index.html"
          test -f "$RUNNER_TEMP/site/wwwroot/3rdpartylicenses.txt"
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        run: npm ci

      # npm exec --no: the project's own tools only, never a download (npx would fetch any package)
      - name: Check formatting
        run: npm exec --no -- prettier --check "src/**/*.{ts,html,css}"

      - name: Build
        run: npm exec --no -- ng build

      - name: Test
        run: npm exec --no -- ng test --watch=false

  # The whole site in a browser (tests/e2e, Playwright): sign-up to coin with photo, share links,
  # sessions, moderation, plus an axe accessibility scan of each page. server/start.mjs builds the
  # client and the API and runs them on their own database in the SQL Server container. Then a
  # ZAP baseline scan of the same site in Production mode; an alert not accepted in .zap/rules.tsv
  # fails the job
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci_Tests_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Tests_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/web/package-lock.json
            tests/e2e/package-lock.json

      - name: Install
        run: |
          (cd src/web && npm ci)
          (cd tests/e2e && npm ci)

      # Playwright's own Chromium (locally the tests use the installed Edge)
      - name: Install browser
        working-directory: tests/e2e
        run: npm exec --no -- playwright install --with-deps chromium

      - name: Test
        working-directory: tests/e2e
        run: npm exec --no -- playwright test
        env:
          COINPORTAL_E2E_SQL: Server=localhost,1433;Database=CoinPortal_E2E;User Id=sa;Password=Ci_Tests_Passw0rd;TrustServerCertificate=True

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore

      # OWASP ZAP baseline (passive) scan of the site as it runs live: Production settings over
      # HTTPS (Secure cookies, HSTS, no Swagger) on the database the tests filled, signed out. A
      # host name other than localhost, which gets no HSTS. .zap/rules.tsv lists the accepted alerts
      # (IGNORE with a reason, WARN for a known gap); any other alert fails the job (.zap/check.mjs),
      # so it blocks a release too. A fixed dated image with its digest, like the SQL Server one
      # (Dependabot does not watch it)
      - name: Start site for ZAP
        working-directory: tests/e2e
        run: |
          echo "127.0.0.1 coinportal.test" | sudo tee -a /etc/hosts
          dotnet dev-certs https -ep "$RUNNER_TEMP/zap-site.pfx" -p zap-site
          nohup node server/start.mjs > "$RUNNER_TEMP/zap-site.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -skf -o /dev/null https://coinportal.test:5443/api/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/zap-site.log"
          exit 1
        env:
          COINPORTAL_E2E_SQL: Server=localhost,1433;Database=CoinPortal_E2E;User Id=sa;Password=Ci_Tests_Passw0rd;TrustServerCertificate=True
          E2E_SKIP_BUILD: '1'
          E2E_ENVIRONMENT: Production
          E2E_URLS: http://localhost:5091;https://*:5443
          Kestrel__Certificates__Default__Path: ${{ runner.temp }}/zap-site.pfx
          Kestrel__Certificates__Default__Password: zap-site

      - name: ZAP baseline scan
        id: zap
        run: |
          mkdir -p "$RUNNER_TEMP/zap"
          cp .zap/rules.tsv "$RUNNER_TEMP/zap/"
          chmod -R a+rwX "$RUNNER_TEMP/zap"
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            zaproxy/zap-stable:20260807@sha256:71db37cd5b75663b35758d10aaec05bf6fbac23f5020e3046c70e628a5f84efa \
            zap-baseline.py -t https://coinportal.test:5443 -j -m 3 -c rules.tsv -I \
              -r zap-report.html -w zap-report.md -J zap-report.json

      - name: Check ZAP alerts
        run: node .zap/check.mjs .zap/rules.tsv "$RUNNER_TEMP/zap/zap-report.json" coinportal.test

      - name: ZAP summary
        if: always() && steps.zap.outcome != 'skipped'
        run: |
          if [ -f "$RUNNER_TEMP/zap/zap-report.md" ]; then
            cat "$RUNNER_TEMP/zap/zap-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ZAP wrote no report; see the scan step's log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ZAP report
        if: always() && steps.zap.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: ${{ runner.temp }}/zap/zap-report.*
          if-no-files-found: ignore
