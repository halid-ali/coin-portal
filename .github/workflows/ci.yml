name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run on the same branch or pull request cancels the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    env:
      # ImageSharp 4 fails Release builds without a license key (see README). Pull requests
      # (Dependabot, forks) get no secrets, so they build Debug, where a missing key is only a warning.
      CONFIGURATION: ${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }}
    services:
      # The API tests need a real SQL Server (collation, CHARINDEX, filtered indexes). The sa
      # password belongs to this throwaway container only, so it is not a secret
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci_Tests_Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Tests_Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer derives the version from the tags in the history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --configuration "$CONFIGURATION"
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

      - name: Check for model changes without a migration
        run: >-
          dotnet ef migrations has-pending-model-changes --project src/api --no-build
          --configuration "$CONFIGURATION"
        env:
          # Design-time only; nothing connects to this database
          ConnectionStrings__DefaultConnection: Server=localhost;Database=ci;Trusted_Connection=True

      - name: Test
        run: dotnet test --project tests/api --no-build --configuration "$CONFIGURATION"
        env:
          # Server only: each run creates and drops its own database
          COINPORTAL_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Ci_Tests_Passw0rd;TrustServerCertificate=True

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false
