name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run on the same branch or pull request cancels the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer derives the version from the tags in the history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      # Debug on purpose: ImageSharp 4 fails Release builds without a license key (see README)
      - name: Build
        run: dotnet build --configuration Debug

      - name: Check for model changes without a migration
        run: dotnet ef migrations has-pending-model-changes --project src/api --no-build
        env:
          # Design-time only; nothing connects to this database
          ConnectionStrings__DefaultConnection: Server=localhost;Database=ci;Trusted_Connection=True

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false
